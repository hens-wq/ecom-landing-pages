name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [claude/icom-college-landing-page-et9b3t]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: icom-fit-check
      - id: deployment
        uses: actions/deploy-pages@v4
