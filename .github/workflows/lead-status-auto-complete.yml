# The 15-minute completion of held Fireberry updates. Prepared, not active.
#
# - Only a manual run (workflow_dispatch) works now. The schedule below is commented out on purpose.
# - GitHub runs scheduled workflows only from the default branch, so enabling the schedule takes a merge to that branch.
# - While LEAD_STATUS_AUTO_COMPLETE is not "on" in Vercel, the endpoint only reports what it would do (a dry run).
#   Nothing is written and nothing is sent to Meta.
# - The secret LEAD_STATUS_ADMIN_SECRET must be stored in this repository's Actions secrets before any run.
name: lead-status-auto-complete

on:
  workflow_dispatch:
  # schedule:
  #   # Every 15 minutes, 06:00-21:59 UTC (about 08:00-23:59 in Israel). About 2,000 minutes a month on a private
  #   # repository: close to the free allowance of a personal account. Use it only after the dry run has been approved.
  #   - cron: "*/15 6-21 * * *"

permissions:
  contents: read

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the completion job
        env:
          ADMIN_SECRET: ${{ secrets.LEAD_STATUS_ADMIN_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://ecom-landing-pages.vercel.app' }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "$APP_URL/api/admin/lead-status/pending" \
            --header "Authorization: Bearer $ADMIN_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"action":"auto"}'
