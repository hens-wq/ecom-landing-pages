<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <meta name="description" content="בדיקת התאמה אינטראקטיבית ללימודי הייטק — מכללת איקום">
  <title>בדיקת התאמה · מכללת איקום</title>

  <!-- פונט Heebo (משתנה, מתארח מקומית — ללא תלות ברשת חיצונית) -->
  <link rel="preload" href="assets/fonts/heebo-hebrew-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/heebo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/style.css">

  <!-- נקודת חיבור עתידית ל־Google Tag Manager: הדביקו כאן את קוד ה־Container -->
</head>
<body>

  <!-- רקע חי: חלקיקים + הילות צבע -->
  <canvas id="bg-particles" aria-hidden="true"></canvas>
  <div class="bg-aurora" aria-hidden="true">
    <div class="aurora aurora--purple"></div>
    <div class="aurora aurora--teal"></div>
    <div class="aurora aurora--green"></div>
  </div>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- סרגל עליון -->
  <header class="topbar">
    <!-- ▼▼ מקום שמור ללוגו — החליפו את התוכן בתגית <img> של הלוגו ▼▼ -->
    <div class="logo-slot" id="logo-slot" aria-label="מכללת איקום"></div>
    <!-- ▲▲ מקום שמור ללוגו ▲▲ -->
    <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false" aria-label="הפעלת צלילים">
      <svg class="icon-sound-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      <svg class="icon-sound-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </header>

  <main id="app">

    <!-- ============ מסך 1: פתיחה ============ -->
    <section class="screen screen--active" id="screen-intro" aria-labelledby="intro-title">
      <div class="screen-inner intro">
        <div class="intro-orb" aria-hidden="true"><span class="orb-core"></span></div>
        <div class="intro-badge" id="intro-badge"></div>
        <h1 class="intro-title" id="intro-title"></h1>
        <p class="intro-subtitle" id="intro-subtitle"></p>

        <div class="intro-steps" id="intro-steps" aria-hidden="true"></div>

        <button class="btn btn--primary btn--xl" id="btn-start" type="button">
          <span class="btn-label" id="btn-start-label"></span>
          <span class="btn-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          </span>
        </button>
        <p class="intro-hint" id="intro-hint"></p>
      </div>
    </section>

    <!-- ============ מסך 2: בחירת מסלול ============ -->
    <section class="screen" id="screen-tracks" aria-labelledby="tracks-title">
      <div class="screen-inner tracks">
        <h2 class="section-title" id="tracks-title"></h2>
        <p class="section-subtitle" id="tracks-subtitle"></p>
        <div class="track-grid" id="track-grid" role="list"></div>
      </div>
    </section>

    <!-- ============ מסך 3: משחק ============ -->
    <section class="screen" id="screen-game" aria-labelledby="game-title">
      <div class="screen-inner game">
        <div class="game-header">
          <div class="game-chip" id="game-chip"></div>
          <div class="game-rounds" id="game-rounds" aria-hidden="true"></div>
        </div>
        <div class="game-timer" aria-hidden="true"><div class="game-timer-fill" id="game-timer-fill"></div></div>
        <h2 class="game-title" id="game-title"></h2>
        <p class="game-instruction" id="game-instruction"></p>
        <div class="game-stage" id="game-stage"></div>
        <div class="game-feedback" id="game-feedback" role="status" aria-live="polite"></div>
      </div>
      <!-- שכבת ספירה לאחור -->
      <div class="countdown" id="countdown" aria-hidden="true"><span class="countdown-num" id="countdown-num"></span></div>
    </section>

    <!-- ============ מסך 3.5: ניתוח תוצאה ============ -->
    <section class="screen" id="screen-analysis" aria-labelledby="analysis-title">
      <div class="screen-inner analysis">
        <div class="analysis-scanner" aria-hidden="true">
          <div class="scanner-ring"></div>
          <div class="scanner-ring scanner-ring--2"></div>
          <div class="scanner-core" id="scanner-core">0</div>
        </div>
        <h2 class="analysis-title" id="analysis-title"></h2>
        <p class="analysis-line" id="analysis-line" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- ============ מסך 4: תוצאה ============ -->
    <section class="screen" id="screen-result" aria-labelledby="result-title">
      <canvas id="confetti-canvas" aria-hidden="true"></canvas>
      <div class="screen-inner result">
        <div class="result-check" aria-hidden="true">
          <svg viewBox="0 0 52 52" width="34" height="34"><circle class="check-circle" cx="26" cy="26" r="24" fill="none"/><path class="check-mark" fill="none" d="M14 27l8 8 16-17"/></svg>
        </div>
        <h2 class="result-title" id="result-title"></h2>

        <div class="score-ring-wrap" aria-hidden="false">
          <svg class="score-ring" viewBox="0 0 200 200" role="img" aria-label="ציון התאמה">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6836FF"/>
                <stop offset="55%" stop-color="#34D1C3"/>
                <stop offset="100%" stop-color="#85ED72"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="100" cy="100" r="86"/>
            <circle class="ring-fill" id="ring-fill" cx="100" cy="100" r="86"/>
          </svg>
          <div class="score-center">
            <span class="score-value" id="score-value">0</span>
            <span class="score-label" id="score-label"></span>
          </div>
        </div>

        <div class="result-track-chip" id="result-track-chip"></div>
        <p class="result-line" id="result-line"></p>
        <p class="result-disclaimer" id="result-disclaimer"></p>

        <a class="btn btn--whatsapp btn--xl" id="btn-whatsapp" href="#" rel="noopener">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.5 0 1.47 1.07 2.89 1.22 3.09.15.2 2.11 3.22 5.1 4.51.71.31 1.27.49 1.7.63.72.23 1.37.2 1.88.12.57-.09 1.76-.72 2.01-1.42.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35zM12.05 21.79h-.01a9.8 9.8 0 0 1-4.99-1.37l-.36-.21-3.71.97.99-3.62-.23-.37a9.77 9.77 0 0 1-1.5-5.21c0-5.4 4.4-9.8 9.81-9.8 2.62 0 5.08 1.02 6.93 2.87a9.74 9.74 0 0 1 2.87 6.94c0 5.4-4.4 9.8-9.8 9.8zm8.34-18.14A11.7 11.7 0 0 0 12.05 .2C5.55.2.26 5.49.26 11.99c0 2.08.54 4.1 1.57 5.89L.16 23.8l6.07-1.59a11.77 11.77 0 0 0 5.81 1.53h.01c6.5 0 11.79-5.29 11.79-11.79 0-3.15-1.23-6.11-3.45-8.3z"/></svg>
          <span id="btn-whatsapp-label"></span>
        </a>
        <button class="btn btn--ghost" id="btn-again" type="button"></button>
      </div>
    </section>

  </main>

  <!-- סקריפטים: סדר הטעינה חשוב -->
  <script src="js/config.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
